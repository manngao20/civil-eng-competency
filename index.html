<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Civil Engineering Competency Research</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F0E8;
    --paper-line: rgba(27,42,51,.10);
    --ink:#182833;
    --ink-soft:#4A5C68;
    --blue:#2C5C82;
    --blue-deep:#1F425C;
    --blue-pale:#DDE7EE;
    --amber:#B9812E;
    --amber-pale:#F3E5CB;
    --moss:#4E7350;
    --moss-pale:#DDE9DC;
    --brick:#A24A3D;
    --brick-pale:#F0DCD7;
    --card:#FBFAF6;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/32px 32px,
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3,.display{font-family:'Newsreader', serif;}
  a{color:var(--blue-deep);}

  header.topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(243,240,232,.92);
    backdrop-filter:blur(6px);
    border-bottom:1.5px solid var(--ink);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brandmark{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brandmark .badge{
    width:42px;height:42px;border:1.5px solid var(--ink); border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
    position:relative;
  }
  .brandmark .badge::before{
    content:""; position:absolute; inset:4px; border:1px solid var(--ink); border-radius:50%; opacity:.5;
  }
  .brandmark .btext{font-size:13px; line-height:1.15;}
  .brandmark .btext b{display:block; font-weight:600;}
  .brandmark .btext span{color:var(--ink-soft); font-size:11px;}

  nav.tabs{display:flex; gap:2px; background:var(--ink); border-radius:3px; padding:3px;}
  nav.tabs button{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em;
    text-transform:uppercase; border:none; background:transparent; color:#cfd8dd;
    padding:8px 14px; cursor:pointer; border-radius:2px; transition:.15s;
  }
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{background:var(--paper); color:var(--ink); font-weight:600;}

  .summary-wrap{position:relative;}
  .summary-pop{display:none; position:absolute; top:calc(100% + 8px); right:0; background:var(--card); border:1.3px solid var(--ink); padding:12px; z-index:60; width:260px; box-shadow:0 4px 14px rgba(24,40,51,.18);}
  .summary-pop.show{display:block;}
  .summary-pop label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px;}
  .summary-pop input{width:100%; padding:8px 9px; border:1.3px solid var(--ink); background:var(--paper); font-family:'IBM Plex Sans'; font-size:12.5px; border-radius:2px; margin-bottom:8px;}
  .summary-pop .prow{display:flex; gap:6px; justify-content:flex-end;}

  main{max-width:1180px; margin:0 auto; padding:0 24px 100px;}
  .page{display:none; animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .hero{padding:64px 0 40px; display:grid; grid-template-columns:1.3fr 1fr; gap:48px; align-items:end;}
  .hero .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.12em; color:var(--blue-deep); text-transform:uppercase; margin-bottom:18px; display:flex; align-items:center; gap:10px;}
  .hero .eyebrow::before{content:""; width:26px; height:1px; background:var(--blue-deep);}
  .hero h1{font-size:52px; font-weight:500; line-height:1.08; margin:0 0 20px; letter-spacing:-.01em; font-style:italic;}
  .hero p.lead{font-size:16.5px; color:var(--ink-soft); line-height:1.65; max-width:52ch; margin:0 0 28px;}
  .hero-actions{display:flex; gap:10px;}
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    padding:12px 20px; border-radius:2px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    cursor:pointer; transition:.15s;
  }
  .btn:hover{background:var(--blue-deep); border-color:var(--blue-deep);}
  .btn.ghost{background:transparent; color:var(--ink);}
  .btn.ghost:hover{background:var(--ink); color:var(--paper);}
  .btn.danger{border-color:var(--brick); background:var(--brick);}
  .btn.danger:hover{background:#832e23; border-color:#832e23;}

  .titleblock{
    border:1.5px solid var(--ink); background:var(--card); font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .titleblock .tb-row{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--ink);}
  .titleblock .tb-row:first-child{border-top:none;}
  .titleblock .tb-cell{padding:11px 14px; border-left:1px solid var(--ink);}
  .titleblock .tb-cell:first-child{border-left:none;}
  .titleblock .tb-cell .lbl{display:block; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;}
  .titleblock .tb-cell .val{font-size:12.5px; font-weight:500;}
  .titleblock .tb-full{grid-column:1 / -1;}
  .titleblock .tb-head{background:var(--ink); color:var(--paper); padding:9px 14px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; display:flex; justify-content:space-between;}
  .titleblock input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:500; color:var(--ink);
    border:none; background:transparent; padding:0; outline:none; resize:none;
  }
  .titleblock input:focus{outline:1.5px dashed var(--blue);}
  .titleblock input[readonly]{color:var(--ink-soft); cursor:default;}
  .titleblock.editing{outline:1.5px dashed var(--blue); outline-offset:2px;}
  .titleblock.editing input{background:var(--blue-pale); color:var(--ink); cursor:text;}

  .statrow{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--ink); border:1.5px solid var(--ink); margin:44px 0;}
  .stat{background:var(--card); padding:22px 20px;}
  .stat .n{font-family:'Newsreader',serif; font-size:34px; font-style:italic;}
  .stat .l{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:4px;}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 20px; gap:20px;}
  .section-head h2{font-size:26px; font-weight:500; font-style:italic; margin:0;}
  .section-head .note{font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .home-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:56px;}
  .navcard{
    border:1.3px solid var(--ink); background:var(--card); padding:22px; cursor:pointer; transition:.15s;
    display:flex; flex-direction:column; gap:10px; min-height:150px;
  }
  .navcard:hover{background:var(--blue-pale); transform:translateY(-2px);}
  .navcard .idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--blue-deep);}
  .navcard h3{margin:0; font-size:19px; font-weight:500;}
  .navcard p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .navcard .go{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;}

  .goalstats{margin:0 0 56px;}
  .goalstats-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:12px;}
  .goal-add-form{display:none; gap:8px; flex-wrap:wrap; border:1.3px solid var(--ink); background:var(--card); padding:14px; margin-bottom:14px;}
  .goal-add-form.show{display:flex;}
  .goal-add-form input, .goal-add-form select{padding:8px 10px; border:1.3px solid var(--ink); background:var(--paper); font-family:'IBM Plex Sans'; font-size:12.5px; border-radius:2px;}
  .goalgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .goalcard{border:1.3px solid var(--ink); background:var(--card); padding:16px 18px; cursor:pointer; transition:.15s;}
  .goalcard:hover{background:var(--blue-pale);}
  .goalcard .ghead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .goalcard .glabel{font-size:14px; font-weight:600;}
  .goalcard .gnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .gtrack{background:var(--paper); border:1px solid var(--paper-line); height:16px; position:relative; overflow:hidden;}
  .gfill{height:100%; background:var(--moss); transition:width .3s;}

  .timeline{position:relative; padding-left:52px; margin-top:30px;}
  .timeline::before{content:""; position:absolute; left:19px; top:6px; bottom:6px; width:1.5px; background:var(--ink); background-image:linear-gradient(var(--ink) 60%, transparent 0); background-size:1.5px 8px;}
  .tstep{position:relative; padding-bottom:38px;}
  .tstep
